[project]
name = "omarchy-settings"
dynamic = ["version"]
description = "Graphical settings app for Omarchy (GTK4 + libadwaita)"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, common bugs
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E402",  # gi.require_version must run before the gi.repository imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long expected strings read better on one line

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
