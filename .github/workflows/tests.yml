name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Arch Linux, like Omarchy: same Python and gettext versions as on the desktop
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed python python-pytest gettext git

      - uses: actions/checkout@v4

      - name: Run tests
        run: python -m pytest -q -rs

  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install ruff
        run: pacman -Syu --noconfirm --needed ruff git

      - uses: actions/checkout@v4

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .
