name: release

# Pushing a tag vX.Y.Z runs the tests, builds the package with the tarball's checksum pinned, publishes the
# GitHub release (notes from docs/releases/vX.Y.Z.md, the package and the PKGBUILD attached) and commits the
# pinned checksum to main.
on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed base-devel git github-cli gettext python

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the package
        # makepkg refuses to run as root
        run: |
          git config --global --add safe.directory "$PWD"
          useradd -m builder
          chown -R builder .
          su builder -c "packaging/arch/build-release.sh $TAG dist"

      - name: Publish the release
        run: |
          gh release create "$TAG" --verify-tag --title "Hyprdial ${TAG#v}" \
            --notes-file "docs/releases/$TAG.md" dist/*.pkg.tar.zst dist/PKGBUILD

      - name: Pin the checksum on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO /tmp/
          git fetch origin main
          git checkout -B main origin/main
          if [ "$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)" != "${TAG#v}" ]; then
            echo "main has moved past $TAG; not pinning"
            exit 0
          fi
          cp /tmp/PKGBUILD /tmp/.SRCINFO packaging/arch/
          git add packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          git diff --cached --quiet && exit 0
          git commit -m "Pin the $TAG checksum in the PKGBUILD"
          git push origin main
