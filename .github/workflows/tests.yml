name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # Arch Linux, like Omarchy: same Python and gettext versions as on the desktop
    container: archlinux:latest
    steps:
      - name: Install dependencies
        # gtk4 (with gtk4-broadwayd), libadwaita and python-gobject for the page smoke test
        run: pacman -Syu --noconfirm --needed python python-pytest gettext git gtk4 libadwaita python-gobject

      - uses: actions/checkout@v4

      - name: Run tests
        run: python -m pytest -q -rs

  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install ruff
        run: pacman -Syu --noconfirm --needed ruff git

      - uses: actions/checkout@v4

      - name: Lint
        run: ruff check .

      - name: Formatting
        run: ruff format --check .

  distros:
    # The dependency names the app uses on each family (hyprdial/deps.py) must exist there, and the app
    # must import with them; the tests then run on that distribution's Python.
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "opensuse/tumbleweed:latest", "debian:testing"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install Python
        # a font for the page smoke test (Pango crashes without any; the Tumbleweed image has none)
        run: |
          if command -v dnf; then dnf install -y python3 git
          elif command -v zypper; then zypper --non-interactive install python3 git dejavu-fonts
          else apt-get update && apt-get install -y python3 git; fi

      - uses: actions/checkout@v4

      - name: Install the dependencies by this distribution's names
        run: |
          python3 - <<'PY'
          import subprocess
          from hyprdial import deps, distro
          print("family:", distro.family())
          packages = [d.package for d in deps.dependencies()]
          print("installing:", " ".join(packages))
          subprocess.run(deps.install_command(packages)[1:], check=True)  # without pkexec: already root
          PY

      - name: Nothing is reported missing
        run: test -z "$(python3 -m hyprdial.deps --missing | tee /dev/stderr)"

      - name: The app's libraries load
        run: python3 -c 'import gi; [gi.require_version(*v) for v in (("Gtk", "4.0"), ("Adw", "1"), ("NM", "1.0"))]; from gi.repository import Adw, Gtk, NM'

      - name: Run tests
        run: python3 -m pytest -q -rs

      - name: Build and install the RPM (Fedora, openSUSE)
        if: ${{ !startsWith(matrix.image, 'debian') }}
        shell: bash
        # --force-resolution: the Tumbleweed image's busybox-gawk gives way to the gawk that rpm-build needs
        run: |
          if command -v dnf; then dnf install -y rpm-build desktop-file-utils; install=(dnf install -y)
          else zypper --non-interactive install --force-resolution rpm-build desktop-file-utils
            install=(zypper --non-interactive install --allow-unsigned-rpm); fi
          version=$(sed -n 's/^Version: *//p' packaging/rpm/hyprdial.spec)
          mkdir -p ~/rpmbuild/SOURCES
          tar --transform "s,^\.,hyprdial-$version," --exclude=./.git -czf ~/rpmbuild/SOURCES/hyprdial-$version.tar.gz .
          rpmbuild -ba --define "_topdir $HOME/rpmbuild" packaging/rpm/hyprdial.spec  # openSUSE defaults to /usr/src/packages
          "${install[@]}" ~/rpmbuild/RPMS/noarch/hyprdial-*.rpm
          test "$(hyprdial --version)" = "hyprdial $version"
